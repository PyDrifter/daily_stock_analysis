name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 自动运行
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 需要写入权限来推送更新

jobs:
  sync:
    runs-on: ubuntu-latest
    # 仅在 Fork 仓库中运行，避免在原始仓库误触发
    if: github.event.repository.fork == true
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main         # 你的默认分支名，按需修改
          fetch-depth: 0
          persist-credentials: false

      - name: Sync with upstream
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: ZhuLinsen/daily_stock_analysis   # 例如 owner/repo
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
